[project]
name = "pathable-pipelines"
version = "0.1.0"
description = "PathAble data ingestion, conflation and graph build for the North York pilot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyogrio>=0.10",
  "pyproj>=3.6",
  "osmium>=4.0",
  "rasterio>=1.4",
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "httpx>=0.27",
  "networkx>=3.3",
  "openpyxl>=3.1",
  "pyarrow>=26.0.0",
  "pathable-api",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.uv]
package = true

[tool.uv.sources]
pathable-api = { path = "../services/api", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pathable_pipelines"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
