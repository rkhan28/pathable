name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - uses: astral-sh/setup-uv@v5
      - run: npm ci --ignore-scripts
        working-directory: apps/web
      - run: npm run contracts
        working-directory: apps/web
      - run: uv run python scripts/build_scoring_cases.py
        working-directory: services/api
      - name: Fail if generated contracts changed
        run: git diff --exit-code -- contracts/

  web:
    name: Web checks and e2e
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - name: Contrast, copy, lint (jsx-a11y errors), types, unit tests
        run: npm run check
      - run: npm run build
        env: { NEXT_PUBLIC_DEV_FIXTURES: "true" }
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }

  api:
    name: API on PostGIS
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    env:
      POSTGIS_IMAGE: postgis/postgis:16-3.5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - name: Integration tests (testcontainers PostGIS, responses validated against contracts/openapi.json)
        run: uv run pytest -q

  pipelines:
    name: Pipelines
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: pipelines } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
