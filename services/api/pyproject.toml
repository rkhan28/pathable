[project]
name = "pathable-api"
version = "0.1.0"
description = "PathAble routing, hazards and reports API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14",
  "boto3>=1.35",
  "fastapi>=0.115",
  "networkx>=3.3",
  "opentelemetry-api>=1.45.2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
  "opentelemetry-instrumentation-fastapi>=0.66b2",
  "opentelemetry-instrumentation-psycopg>=0.66b2",
  "opentelemetry-sdk>=1.45.2",
  "pillow>=11",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.9",
  "python-multipart>=0.0.18",
  "redis>=5.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.9",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pathable_api"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # Starlette's test client warns that it will move to a new HTTP library. That
  # is its own migration, not ours; keep every other warning visible.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
